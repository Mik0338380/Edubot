<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Splash Screen EduSmart -->
<div id="splash-screen">

    <div class="splash-content">

        <i class="bi bi-mortarboard-fill splash-icon"></i>

        <h1>EduSmart</h1>

        <p>Media Pembelajaran</p>

    </div>

</div>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">

    <i class="bi bi-mortarboard-fill logo-icon"></i>

    <h2>EduSmart</h2>

    <small>Media Pembelajaran</small>

</div>

        <nav>

            <a href="#" class="menu active" id="menu-home">
               <i class="bi bi-house-door"></i>
               <span>Beranda</span>
            </a>

            <a href="#" class="menu" id="menu-materi">
               <i class="bi bi-book"></i>
               <span>Materi</span>
            </a>

            <a href="#" class="menu" id="menu-latihan">
                <i class="bi bi-pencil-square"></i>
                <span>Latihan</span>
                </a>

            <a href="#" class="menu" id="menu-tentang">
                <i class="bi bi-info-circle"></i>
                <span>Tentang</span>
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="content">

    <div id="page-content"></div>

</main>

</div>

<!-- EduBot -->

<div id="chatbot">

    <button id="chat-toggle">

        <i class="bi bi-robot"></i>

    </button>

    <div id="chat-window">

        <div class="chat-header">

            EduBot

        </div>

        <div class="chat-body" id="chat-body">

    <div class="bot-message">
        Halo 👋<br>
        Saya EduBot.
        Silakan tanyakan materi yang sedang dipelajari.
    </div>

</div>

<div class="chat-footer">

    <input
        type="text"
        id="user-input"
        placeholder="Ketik pertanyaan..."
    >

    <button id="send-btn">
        Kirim
    </button>

</div>

    </div>

</div>


<!-- ===========================
     Modal Komponen Antarmuka
=========================== -->

<div class="modal fade" id="komponenModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="modalTitle">
                    Judul
                </h5>

<!-- Modal File & Folder -->
<div class="modal fade" id="fileFolderModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="fileFolderTitle"></h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body" id="fileFolderBody">
            </div>

        </div>
    </div>
</div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body" id="modalBody">

                Isi Modal

            </div>

            <div class="modal-footer">

                <button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/pages.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/app.js"></script>

</body>


</html>
